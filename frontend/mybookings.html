<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - Travel Planner</title>
  <script src="auth.js"></script>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" as="style">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    .navbar {
      background-color: rgba(26, 26, 26, 0.9);
      padding: 1rem 2rem;
      position: fixed;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #ff7f50;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
      list-style: none;
    }

    .nav-links li a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .nav-links li a:hover {
      color: #ff7f50;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: rgba(26, 26, 26, 0.9);
      min-width: 160px;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 4px;
      margin-top: 10px;
    }

    .dropdown-content a {
      color: white;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      transition: background-color 0.3s ease;
    }

    .dropdown-content a:hover {
      background-color: rgba(255, 127, 80, 0.2);
    }

    .show {
      display: block;
    }

    .page-header {
      height: 40vh;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('/images/travel-bg.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }

    .page-header h1 {
      font-size: 3rem;
      color: white;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      background-color: #f5f5f5;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      color: #333;
      font-weight: 600;
    }

    .filter-btn.active {
      background-color: #ff7f50;
      color: white;
    }

    .filter-btn:hover:not(.active) {
      background-color: #e0e0e0;
    }

    .bookings-container {
      margin-top: 20px;
    }

    .booking-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .booking-card {
        flex-direction: row;
      }
    }

    .booking-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    @media (min-width: 768px) {
      .booking-image {
        width: 300px;
      }
    }

    .booking-info {
      padding: 20px;
      flex: 1;
    }

    .booking-info h3 {
      color: #333;
      margin-bottom: 10px;
    }

    .booking-details {
      margin-bottom: 15px;
    }

    .booking-details p {
      margin-bottom: 5px;
      color: #666;
    }

    .booking-status {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 15px;
    }

    .status-confirmed {
      background-color: #e6f7e6;
      color: #28a745;
    }

    .status-pending {
      background-color: #fff3cd;
      color: #ffc107;
    }

    .status-cancelled {
      background-color: #f8d7da;
      color: #dc3545;
    }

    .booking-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-primary {
      background-color: #ff7f50;
      color: white;
    }

    .btn-primary:hover {
      background-color: #ff6b3d;
    }

    .btn-secondary {
      background-color: #f5f5f5;
      color: #333;
    }

    .btn-secondary:hover {
      background-color: #e0e0e0;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    .no-bookings {
      text-align: center;
      padding: 40px;
      background-color: #f5f5f5;
      border-radius: 10px;
    }

    .no-bookings h3 {
      color: #333;
      margin-bottom: 15px;
    }

    .no-bookings p {
      color: #666;
      margin-bottom: 20px;
    }

    .explore-btn {
      padding: 15px 40px;
      background-color: #ff7f50;
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 1.2rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.3s ease, background-color 0.3s ease;
      display: inline-block;
    }

    .explore-btn:hover {
      background-color: #ff6b3d;
      transform: translateY(-2px);
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      color: #666;
    }

    footer {
      background-color: #1a1a1a;
      color: white;
      text-align: center;
      padding: 20px;
      position: relative;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">TravelPlanner</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="mybookings.html">My Bookings</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li class="dropdown">
        <a href="login.html" id="userButton">Login</a>
        <div class="dropdown-content" id="dropdownMenu">
          <a href="#" id="logoutButton">Logout</a>
        </div>
      </li>
    </ul>
  </nav>

  <section class="page-header">
    <h1>My Bookings</h1>
  </section>

  <main class="main-content">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All Bookings</button>
      <button class="filter-btn" data-filter="confirmed">Confirmed</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="cancelled">Cancelled</button>
    </div>

    <div class="bookings-container" id="bookingsContainer">
      <!-- Bookings will be loaded here -->
      <p class="loading" id="loadingMessage">Loading your bookings...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 TravelPlanner | Designed with passion</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      
      const userButton = document.getElementById('userButton');
      const dropdownMenu = document.getElementById('dropdownMenu');
      const logoutButton = document.getElementById('logoutButton');
      const bookingsContainer = document.getElementById('bookingsContainer');
      const filterButtons = document.querySelectorAll('.filter-btn');
      const loadingMessage = document.getElementById('loadingMessage');
      
      
      const username = localStorage.getItem('username');
      const isLoggedIn = localStorage.getItem('isLoggedIn') === "true";
      
      if (isLoggedIn && username) {
        userButton.textContent = username;
        userButton.href = '#';
        
        
        userButton.addEventListener('click', function(e) {
          e.preventDefault();
          dropdownMenu.classList.toggle('show');
        });
        
        // Close dropdown when clicking outside
        window.addEventListener('click', function(e) {
          if (!userButton.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownMenu.classList.remove('show');
          }
        });
        
        // Logout functionality
        logoutButton.addEventListener('click', function(e) {
          e.preventDefault();
          localStorage.removeItem('username');
          localStorage.removeItem('isLoggedIn');
          window.location.href = 'login.html';
        });
        
        // Load real bookings data
        fetchBookings();
      } else {
        userButton.textContent = 'Login';
        userButton.href = 'login.html';
        dropdownMenu.style.display = 'none';
        
        // Show message for non-logged in users
        loadingMessage.style.display = 'none';
        bookingsContainer.innerHTML = `
          <div class="no-bookings">
            <h3>You need to log in to view your bookings</h3>
            <p>Please log in to access your booking information</p>
            <a href="login.html" class="btn btn-primary">Log In</a>
          </div>
        `;
      }
      
      // Filter functionality
      filterButtons.forEach(button => {
        button.addEventListener('click', function() {
          const filter = this.getAttribute('data-filter');
          
          // Toggle active class
          filterButtons.forEach(btn => btn.classList.remove('active'));
          this.classList.add('active');
          
          // Apply filter if user is logged in
          if (isLoggedIn) {
            filterBookings(filter);
          }
        });
      });
      
      async function fetchBookings() {
  try {
    loadingMessage.style.display = 'block';
    
    // Check authentication status
    const response = await fetch('/api/auth/status');
    const authStatus = await response.json();
    
    if (!authStatus.loggedIn) {
      throw new Error('User not authenticated');
    }
    
    // Fetch bookings
    const bookingsResponse = await fetch('/api/my-bookings');
    
    if (!bookingsResponse.ok) {
      throw new Error('Failed to fetch bookings');
    }
    
    const bookings = await bookingsResponse.json();
    loadingMessage.style.display = 'none';
    
    if (bookings.length > 0) {
      renderBookings(bookings);
    } else {
      bookingsContainer.innerHTML = `
        <div class="no-bookings">
          <h3>You don't have any bookings yet</h3>
          <p>Start exploring destinations and book your next adventure!</p>
          <a href="explore.html" class="explore-btn">Explore Destinations</a>
        </div>
      `;
    }
  } catch (error) {
    console.error('Error fetching bookings:', error);
    loadingMessage.style.display = 'none';
    bookingsContainer.innerHTML = `
      <div class="no-bookings">
        <h3>Error Loading Bookings</h3>
        <p>We encountered an issue fetching your bookings. Please try again later.</p>
        <button class="btn btn-primary" onclick="fetchBookings()">Retry</button>
      </div>
    `;
  }
}
      
function renderBookings(bookings) {
    bookingsContainer.innerHTML = '';
    
    bookings.forEach(booking => {
        const card = document.createElement('div');
        card.className = `booking-card booking-${booking.status}`;
        card.innerHTML = `
            <img src="${booking.imageUrl || '/images/travel-bg.jpg'}" alt="${booking.destination}" class="booking-image" loading="lazy">
            <div class="booking-info">
                <h3>${booking.destination}</h3>
                <div class="booking-status status-${booking.status}">${booking.status.charAt(0).toUpperCase() + booking.status.slice(1)}</div>
                <div class="booking-details">
                    <p><strong>Check-in:</strong> ${new Date(booking.checkIn).toLocaleDateString()}</p>
                    <p><strong>Check-out:</strong> ${new Date(booking.checkOut).toLocaleDateString()}</p>
                    <p><strong>Guests:</strong> ${booking.guests}</p>
                    <p><strong>Total:</strong> $${parseFloat(booking.price).toFixed(2)}</p>
                </div>
                <div class="booking-actions">
                    ${booking.status === 'confirmed' ? `<button class="btn btn-primary" onclick="viewBookingDetails('${booking._id}')">View Details</button>` : ''}
                    ${booking.status === 'pending' ? `<button class="btn btn-secondary" onclick="modifyBooking('${booking._id}')">Modify</button>` : ''}
                    ${booking.status !== 'cancelled' ? `<button class="btn btn-danger" onclick="cancelBooking('${booking._id}')">Cancel</button>` : ''}
                </div>
            </div>
        `;
        bookingsContainer.appendChild(card);
    });
}
      function filterBookings(filter) {
        const bookingCards = document.querySelectorAll('.booking-card');
        
        bookingCards.forEach(card => {
          if (filter === 'all' || card.classList.contains(`booking-${filter}`)) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      }
    });
    
    // Functions to handle booking actions
    function viewBookingDetails(bookingId) {
      // Navigate to booking details page or show modal
      window.location.href = `booking-details.html?id=${bookingId}`;
    }
    
    function modifyBooking(bookingId) {
      // Navigate to booking modification page
      window.location.href = `modify-booking.html?id=${bookingId}`;
    }
    
    function cancelBooking(bookingId) {
      if (confirm('Are you sure you want to cancel this booking?')) {
        // Call API to cancel booking
        fetch(`/api/bookings/${bookingId}/cancel`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          }
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('Failed to cancel booking');
          }
          return response.json();
        })
        .then(data => {
          alert('Booking cancelled successfully');
          location.reload(); // Refresh to show updated status
        })
        .catch(error => {
          console.error('Error cancelling booking:', error);
          alert('Failed to cancel booking. Please try again later.');
        });
      }
    }
  </script>
</body>
</html>
